# Valores para ejecutar en local contra la infraestructura de compose; en contenedor se sobrescriben.
server:
  port: 8083

spring:
  application:
    name: clasificacion
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mariadb://localhost:3307/clasificacion
    username: clasificacion
    password: clasificacion-dev
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: clasificacion
      auto-offset-reset: earliest

gastos:
  mensajeria:
    contexto: clasificacion
    consume:
      - identidad.eventos
      - movimientos.eventos
  seguridad:
    jwk-set-uri: http://localhost:8081/.well-known/jwks.json
  servicios:
    movimientos: http://localhost:8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
