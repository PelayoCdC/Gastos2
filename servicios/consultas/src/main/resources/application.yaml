# Valores para ejecutar en local contra la infraestructura de compose; en contenedor se sobrescriben.
server:
  port: 8085

spring:
  application:
    name: consultas
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mariadb://localhost:3307/consultas
    username: consultas
    password: consultas-dev
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      auto-offset-reset: earliest
      # Lotes grandes: una importación son cientos de eventos que se proyectan en una transacción
      max-poll-records: 500

gastos:
  mensajeria:
    contexto: consultas
    # consultas solo lee: no tiene outbox que publicar ni topic propio
    publica: false
    consume:
      - movimientos.eventos
      - clasificacion.eventos
      - importacion.eventos
  consultas:
    proyeccion:
      # Grupo consultas-v<version>: cambiarla hace que un grupo nuevo relea los topics desde el principio (docs/adr/0010)
      version: 1
  seguridad:
    jwk-set-uri: http://localhost:8081/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Muestra el retraso de la proyección (componente "proyeccion"), útil al reconstruir
      show-details: always
