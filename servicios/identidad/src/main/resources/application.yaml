# Valores para ejecutar en local contra la infraestructura de compose (MariaDB 3307, Kafka 9094).
# En contenedor se sobrescriben con variables de entorno (ver compose.yaml).
server:
  port: 8081

spring:
  application:
    name: identidad
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mariadb://localhost:3307/identidad
    username: identidad
    password: identidad-dev
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      acks: all
      properties:
        enable.idempotence: true

gastos:
  mensajeria:
    contexto: identidad
  seguridad:
    rutas-publicas:
      - POST /registros
      - POST /sesiones
      - GET /.well-known/jwks.json
  identidad:
    clave-privada: file:../../infra/claves/jwt-privada.pem
    permitir-clave-efimera: true
    expiracion: 24h

management:
  endpoints:
    web:
      exposure:
        include: health,info
