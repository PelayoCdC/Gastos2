# Valores para ejecutar en local contra la infraestructura de compose; en contenedor se sobrescriben.
server:
  port: 8082

spring:
  application:
    name: movimientos
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mariadb://localhost:3307/movimientos
    username: movimientos
    password: movimientos-dev
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      acks: all
      properties:
        enable.idempotence: true

gastos:
  mensajeria:
    contexto: movimientos
  seguridad:
    jwk-set-uri: http://localhost:8081/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info
