# Stack completo de Gastos2. Ver docs/arquitectura/06-despliegue.md.
#
#   docker compose up -d mariadb kafka --wait     # solo infraestructura (desarrollo con el IDE)
#   docker compose up -d --build --wait           # todo
#   docker compose down                           # -v borra también los datos
#
# Puertos en el host elegidos para no chocar con el stack antiguo de Gastos (8080, 3306, 4200):
#   MariaDB 3307, Kafka 9094.

name: gastos2

services:
  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: root-dev
      TZ: Europe/Madrid
    ports:
      - "3307:3306"
    volumes:
      - datos-mariadb:/var/lib/mysql
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:4.2.2
    environment:
      # Nodo único en modo KRaft (broker y controller a la vez, sin ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "SqWCvmgSCBZAuhoWTKae5A"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNO://:9092,CONTROLLER://:9093,EXTERNO://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:9092,EXTERNO://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los topics los declara cada servicio productor (NewTopic) con su configuración: retención infinita
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"
    volumes:
      - datos-kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  identidad:
    build:
      context: .
      target: identidad
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/identidad
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GASTOS_IDENTIDAD_CLAVE_PRIVADA: file:/claves/jwt-privada.pem
      # Sin clave montada se usa una efímera (solo desarrollo); scripts/generar-claves-dev.sh crea la fija
      GASTOS_IDENTIDAD_PERMITIR_CLAVE_EFIMERA: "true"
    volumes:
      - ./infra/claves:/claves:ro
    ports:
      # Solo en localhost y para depurar; el acceso normal es a través del gateway
      - "127.0.0.1:8081:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
    healthcheck: &salud-spring
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  movimientos:
    build:
      context: .
      target: movimientos
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/movimientos
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GASTOS_SEGURIDAD_JWK_SET_URI: http://identidad:8080/.well-known/jwks.json
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 512m
    healthcheck: *salud-spring

  gateway:
    build:
      context: .
      target: gateway
    environment:
      GASTOS_SERVICIOS_IDENTIDAD: http://identidad:8080
      GASTOS_SERVICIOS_MOVIMIENTOS: http://movimientos:8080
      GASTOS_SERVICIOS_CLASIFICACION: http://clasificacion:8080
      GASTOS_SERVICIOS_IMPORTACION: http://importacion:8080
      GASTOS_SERVICIOS_CONSULTAS: http://consultas:8080
    ports:
      # Única entrada desde fuera (el front en el navegador habla con este puerto)
      - "8090:8080"
    depends_on:
      identidad:
        condition: service_healthy
    mem_limit: 384m
    healthcheck: *salud-spring

volumes:
  datos-mariadb:
  # El log de Kafka es la fuente para reconstruir las proyecciones de consultas: hay que respaldarlo
  datos-kafka:
